# ==============================================================================
# HireEase Services - Production Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/hireease.conf
# Enable: ln -s /etc/nginx/sites-available/hireease.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
# ==============================================================================

# Upstream HireEase Node.js Server
upstream hireease_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP Server (Redirect to HTTPS or direct proxy if SSL not configured yet)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # <-- Replace with your domain or VPS IP

    # Let's Encrypt Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy directly or redirect to HTTPS
    location / {
        proxy_pass http://hireease_upstream;
        proxy_http_version 1.1;

        # WebSocket & Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for streaming RSC & API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering off;
    }

    # Maximum upload size for candidate résumés (50MB)
    client_max_body_size 50M;
}

