# ==============================================================================
# HireEase Services - Production Nginx Reverse Proxy Configuration
# Domain: hireeaseservices.in / www.hireeaseservices.in
# Upstream Port: 9444
# ==============================================================================

upstream hireease_upstream {
    server 127.0.0.1:9444;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name hireeaseservices.in www.hireeaseservices.in;

    # Let's Encrypt Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reverse proxy to HireEase application
    location / {
        proxy_pass http://hireease_upstream;
        proxy_http_version 1.1;

        # WebSocket & Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forward proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for streaming RSC & API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # Maximum upload size for candidate résumé PDFs (50MB)
    client_max_body_size 50M;
}
